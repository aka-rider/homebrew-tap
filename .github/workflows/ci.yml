name: CI

on:
  push:
    paths: ["Formula/**", "Casks/**"]
  pull_request:
    paths: ["Formula/**", "Casks/**"]
  # release-vuho.yml pushes cask bumps unattended, so this audit is the only
  # review those commits get. Make it runnable on demand too: a dropped or
  # filtered push event would otherwise leave a published cask unaudited with
  # no way to check it short of an empty commit.
  workflow_dispatch:

jobs:
  whisper:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew downloads (models + server binary)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-downloads-1fc70f77-2aa269b7

      - run: brew style Formula/

      - run: brew audit ${{ github.repository_owner }}/tap/whisper-cpp-silero-vad
      - run: brew install ${{ github.repository_owner }}/tap/whisper-cpp-silero-vad
      - run: brew test whisper-cpp-silero-vad

      - run: brew audit ${{ github.repository_owner }}/tap/whisper-cpp-large-v3-turbo
      - run: brew install ${{ github.repository_owner }}/tap/whisper-cpp-large-v3-turbo
      - run: brew test whisper-cpp-large-v3-turbo

      - run: brew audit ${{ github.repository_owner }}/tap/whisper-cpp-server
      - run: brew install ${{ github.repository_owner }}/tap/whisper-cpp-server
      - run: brew test whisper-cpp-server
      - run: brew linkage whisper-cpp-server

  # Covers human edits to Casks/vuho.rb (pushes, PRs, manual runs). It does
  # NOT cover release-vuho.yml's automated bumps: those push with the default
  # GITHUB_TOKEN, which by design never triggers another workflow, so no CI
  # run is created for them however they are committed. That path runs the
  # same checks itself, before pushing — see release-vuho.yml.
  vuho:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@main

      - run: brew style Casks/vuho.rb
      - run: brew audit --cask ${{ github.repository_owner }}/tap/vuho
      - run: brew install --cask ${{ github.repository_owner }}/tap/vuho

      # `brew install --cask` succeeding only proves the download hashed and
      # unpacked. Assert the app actually landed, and that its version is the
      # one the cask claims — a tarball built from the wrong tag would install
      # cleanly and still be the wrong app.
      - name: Verify installed app matches cask version
        run: |
          set -euo pipefail
          APP="/Applications/Vuho.app"
          [[ -d "$APP" ]] || { echo "::error::$APP not installed"; exit 1; }
          CASK_VERSION="$(brew info --cask --json=v2 ${{ github.repository_owner }}/tap/vuho | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['casks'][0]['version'])")"
          APP_VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          echo "cask=$CASK_VERSION app=$APP_VERSION"
          [[ "$CASK_VERSION" == "$APP_VERSION" ]] || \
            { echo "::error::installed app version ($APP_VERSION) != cask version ($CASK_VERSION)"; exit 1; }
